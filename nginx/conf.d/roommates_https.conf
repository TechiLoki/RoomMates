server {
        include       /etc/nginx/mime.types;
	
	root /nginx_files/frontend;
	index index.html;
	

        listen 			443 ssl;
	server_name 		roommates.kikvadze.com;
	ssl_certificate 	fullchain.pem;
	ssl_certificate_key 	privkey.pem;
	ssl_protocols		TLSv1.2 TLSv1.3;
	ssl_ciphers          	HIGH:!aNULL:!MD5;
	ssl_session_cache   	shared:SSL:10m;
    	ssl_session_timeout 	10m;
	
	client_max_body_size 20M;	
	
	location ~ ^/rpc/(login|add_user|test_endpoint|debug_headers|get_user_info|update_user_info|update_password|delete_user|update_about_user)$ {                                                                                                                                                                                    
	include ./psql_cors.conf;                                                                                                                                                                                                                                                                                               
	proxy_pass http://postgrest-auth:3001;                                                                                                                                      
	proxy_set_header Host $host;                                                 
	proxy_set_header X-Real-IP $remote_addr;                                                                                                                    
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                                                                                                
	proxy_set_header X-Forwarded-Proto $scheme;                                                                                                                                                                                                                                                                             

	proxy_set_body $request_body;                                                                                                                      }

	location ~ ^/rpc/(add_listing|main_delete_user|admin_add_city|delete_listing|get_all_listings|get_listing|search_listings|stress_test|update_listing|test_endpoint)$ {

                include ./psql_cors.conf;

                proxy_pass http://postgrest-main:3000;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-HTTP-Method $request_method;

		proxy_set_body $request_body;
           }

	location /nginx_auth {
                        internal;

                        proxy_pass http://postgrest-auth:3001/rpc/nginx_auth;

                        proxy_pass_request_body off;
                        proxy_set_header Content-Length "";
                        proxy_set_header X-Original-Uri $request_uri;
                        proxy_set_header X-Original-Method $request_method;

                        client_max_body_size 1000M;
           }

        location ~ /upload/pfp/(.*)$ {
                include ./file_cors.conf;

                auth_request /nginx_auth;

                dav_methods             PUT DELETE MKCOL COPY MOVE;
                client_body_temp_path   /tmp/upload_tmp;
                alias                   /nginx_files/pfp/$1;
                create_full_put_path    on;
                dav_access              group:rw  all:r;

                min_delete_depth 0;

                limit_except PUT OPTIONS DELETE { deny all; }

              #  client_max_body_size 1000M;
        }

	location ~ ^/get/pfp/(.*)$ {
                include ./file_cors.conf;

                auth_request /nginx_auth;

                alias /nginx_files/pfp/$1;
        }


        location ~ ^/upload/listing/(.*)$ {
                include ./file_cors.conf;

                auth_request /nginx_auth;

                dav_methods             PUT DELETE MKCOL COPY MOVE;
                client_body_temp_path   /tmp/upload_tmp;
                alias                   /nginx_files/listing/$1;
                create_full_put_path    on;
                dav_access              group:rw  all:r;

                min_delete_depth 0;

                limit_except PUT OPTIONS DELETE { deny all; }

               # client_max_body_size 1000M;
        }


        location ~ ^/get/listing/(.*)$ {
                include ./file_cors.conf;

                auth_request /nginx_auth;

                alias /nginx_files/listing/$1;
        }

	location ~ ^/ {
                try_files $uri /index.html;
        }

        location /styles/ {
                alias /nginx_files/frontend/styles/;
        }



  }













